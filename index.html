    <script>
      // Aggressive watermark removal — watches for dynamically injected elements
      (function() {
        function killWatermark() {
          var selectors = [
            '#kimi-watermark','.kimi-watermark','[data-kimi-watermark]',
            '.kimi-badge','#kimi-badge','[data-agent-watermark]','.agent-watermark',
            '.kimi-assistant-badge','#kimi-assistant-badge',
            '[class*="kimi"]','[id*="kimi"]','[class*="agent"]',
            'div[style*="position: fixed"][style*="bottom"][style*="right"]',
            'div[style*="z-index: 9999"]','div[style*="z-index:9999"]'
          ];
          selectors.forEach(function(sel) {
            try {
              document.querySelectorAll(sel).forEach(function(el) {
                var text = el.textContent || '';
                var html = el.innerHTML || '';
                if (text.toLowerCase().indexOf('kimi') !== -1 ||
                    html.toLowerCase().indexOf('kimi') !== -1 ||
                    el.className.toLowerCase().indexOf('kimi') !== -1 ||
                    el.id.toLowerCase().indexOf('kimi') !== -1) {
                  el.remove();
                }
              });
            } catch(e) {}
          });
          // Target shadow DOM iframes
          document.querySelectorAll('iframe').forEach(function(el) {
            if (el.src && el.src.indexOf('kimi') !== -1) el.remove();
          });
        }
        // Run on multiple events
        document.addEventListener('DOMContentLoaded', killWatermark);
        window.addEventListener('load', killWatermark);
        [100, 300, 500, 1000, 1500, 2000, 3000, 5000].forEach(function(t) {
          setTimeout(killWatermark, t);
        });
        // MutationObserver to catch dynamically injected watermark
        if (window.MutationObserver) {
          var observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
              mutation.addedNodes.forEach(function(node) {
                if (node.nodeType === 1) {
                  var el = node;
                  var cls = (el.className || '').toLowerCase();
                  var id = (el.id || '').toLowerCase();
                  var txt = (el.textContent || '').toLowerCase();
                  if (cls.indexOf('kimi') !== -1 || id.indexOf('kimi') !== -1 ||
                      cls.indexOf('agent') !== -1 || id.indexOf('agent') !== -1 ||
                      txt.indexOf('kimi') !== -1) {
                    el.remove();
                  }
                  // Also check children
                  if (el.querySelectorAll) {
                    el.querySelectorAll('[class*="kimi"], [id*="kimi"], [class*="agent"]').forEach(function(c) { c.remove(); });
                  }
                }
              });
            });
          });
          observer.observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
